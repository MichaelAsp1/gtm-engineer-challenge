<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sales Intelligence</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0a0a0a;
      --surface:     #111111;
      --surface-2:   #1a1a1a;
      --border:      #222222;
      --border-2:    #2d2d2d;
      --text:        #e0e0e0;
      --text-muted:  #666666;
      --text-dim:    #999999;
      --red:         #ef4444;
      --orange:      #f97316;
      --green:       #22c55e;
      --blue:        #60a5fa;
      --font-sans:   system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono:   ui-monospace, "SF Mono", Menlo, monospace;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; }

    /* ── Layout ── */
    #app { display: grid; grid-template-rows: 48px 1fr; grid-template-columns: 220px 1fr 220px; height: 100vh; }

    /* ── Header ── */
    header {
      grid-column: 1 / 4;
      display: flex; align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .header-left { display: flex; align-items: center; gap: 24px; flex: 1; white-space: nowrap; flex-shrink: 0; }
    .header-center { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .header-right { flex: 1; display: flex; align-items: center; justify-content: flex-end; white-space: nowrap; gap: 10px; padding-right: 8px; }
    header h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; color: var(--text); }
    header .sep { color: var(--border-2); }
    .stat { font-size: 12px; color: var(--text-muted); }
    .stat strong { color: var(--text-dim); font-weight: 500; }
    #status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--border-2); margin-left: auto; flex-shrink: 0;
      transition: background 0.3s;
    }
    #status-dot.ready { background: var(--green); }

    /* ── Sidebar ── */
    aside {
      background: var(--surface);
      overflow-y: auto;
      display: flex; flex-direction: column;
    }
    #sidebar-left  { border-right: 1px solid var(--border); }
    #sidebar-right { border-left:  1px solid var(--border); }
    .sidebar-label {
      padding: 14px 16px 8px;
      font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-muted);
    }

    .account-card {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }
    .account-card:hover { background: var(--surface-2); }
    .account-card:first-of-type { border-top: none; }

    .account-row { display: flex; align-items: baseline; gap: 8px; justify-content: space-between; }
    .account-name { font-size: 12.5px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .account-score {
      font-size: 11px; font-weight: 600; font-family: var(--font-mono);
      flex-shrink: 0; padding: 1px 5px; border-radius: 3px;
    }
    .score-crit  { background: rgba(239,68,68,0.15);  color: var(--red); }
    .score-high  { background: rgba(249,115,22,0.15); color: var(--orange); }
    .score-med   { background: rgba(96,165,250,0.1);  color: var(--blue); }

    .account-signal {
      margin-top: 3px;
      font-size: 11px; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .account-meta {
      margin-top: 2px;
      font-size: 11px; color: var(--text-muted); font-family: var(--font-mono);
    }

    /* ── Chat ── */
    #chat { display: flex; flex-direction: column; min-height: 0; }

    #messages {
      flex: 1; overflow-y: auto; padding: 24px 32px;
      display: flex; flex-direction: column; gap: 24px;
      align-items: center;
    }

    .message { display: flex; flex-direction: column; gap: 8px; max-width: 700px; width: 100%; }
    .message.user { align-self: flex-end; align-items: flex-end; }

    .message-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .message.user   .message-label { color: var(--text-muted); }
    .message.assistant .message-label { color: var(--blue); }

    .message-body {
      font-size: 13.5px; line-height: 1.65; color: var(--text);
    }
    .message.user .message-body {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 14px;
      color: var(--text-dim);
    }

    /* markdown styling inside assistant messages */
    .message-body { font-size: 14px; line-height: 1.7; }
    .message-body p { margin-bottom: 0.75em; }
    .message-body p:last-child { margin-bottom: 0; }
    .message-body strong { color: var(--text); font-weight: 600; }
    .message-body ul { padding-left: 1.3em; margin-bottom: 0.75em; }
    .message-body ul li { margin-bottom: 0.45em; }
    .message-body ol { padding-left: 1.3em; margin-bottom: 0.75em; list-style: none; counter-reset: ol-counter; }
    .message-body ol li {
      counter-increment: ol-counter; position: relative; padding-left: 1.6em;
      margin-bottom: 1.4em; padding-bottom: 1.4em;
      border-bottom: 1px solid var(--border);
    }
    .message-body ol li::before {
      content: counter(ol-counter) ".";
      position: absolute; left: 0; color: var(--text-muted);
      font-weight: 600; font-size: 13px;
    }
    .message-body ol li:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .message-body code {
      font-family: var(--font-mono); font-size: 12px;
      background: var(--surface-2); padding: 1px 5px;
      border-radius: 3px; color: var(--text-dim);
    }
    .message-body h1 { font-size: 16px; font-weight: 700; color: var(--text); margin: 1.4em 0 0.6em; }
    .message-body h2 { font-size: 14px; font-weight: 700; color: var(--text); margin: 1.4em 0 0.5em; letter-spacing: 0.01em; }
    .message-body h3 { font-size: 13px; font-weight: 600; color: var(--text-dim); margin: 1em 0 0.4em; text-transform: uppercase; letter-spacing: 0.06em; }
    .message-body h1:first-child, .message-body h2:first-child, .message-body h3:first-child { margin-top: 0; }
    .message-body table { border-collapse: collapse; width: 100%; margin-bottom: 0.75em; font-size: 13px; }
    .message-body th { background: var(--surface-2); padding: 7px 12px; text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); border-bottom: 1px solid var(--border-2); }
    .message-body td { padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: top; }
    .message-body tr:last-child td { border-bottom: none; }
    .message-body tr:hover td { background: var(--surface-2); }

    .action-result {
      font-size: 12px; color: var(--green); margin-top: 6px;
      font-family: var(--font-mono);
    }

    /* ── Briefing card ── */
    .message.briefing .message-label {
      color: var(--text-muted);
      display: flex; align-items: center; gap: 8px;
    }
    .message.briefing .message-label::before {
      content: '';
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: var(--green); flex-shrink: 0;
    }
    .message.briefing .message-body {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 2px solid var(--border-2);
      border-radius: 4px;
      padding: 20px 24px;
    }

    /* ── Dot pulse (while waiting for first token) ── */
    .dot-pulse { display: inline-flex; align-items: center; gap: 4px; padding: 4px 0; }
    .dot-pulse span {
      display: inline-block; width: 5px; height: 5px;
      border-radius: 50%; background: var(--text-muted);
      animation: dot-fade 1.2s ease-in-out infinite;
    }
    .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
    .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-fade { 0%,80%,100%{opacity:0.15} 40%{opacity:1} }

    /* ── Input ── */
    #input-area {
      padding: 16px 32px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      display: flex; justify-content: center;
    }
    #input-area form { display: flex; gap: 10px; width: 100%; max-width: 760px; }

    textarea {
      flex: 1; resize: none; overflow: hidden;
      background: var(--surface); border: 1px solid var(--border-2);
      border-radius: 4px; padding: 9px 12px;
      font: inherit; font-size: 13.5px; color: var(--text);
      outline: none; line-height: 1.5; min-height: 40px; max-height: 140px;
      transition: border-color 0.15s;
    }
    textarea:focus { border-color: var(--border-2); }
    textarea::placeholder { color: var(--text-muted); }

    button[type=submit] {
      background: var(--surface-2); border: 1px solid var(--border-2);
      color: var(--text-dim); font: inherit; font-size: 12px; font-weight: 500;
      padding: 0 16px; height: 40px; border-radius: 4px; cursor: pointer;
      white-space: nowrap; transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    button[type=submit]:hover:not(:disabled) { background: var(--border-2); color: var(--text); }
    button[type=submit]:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Loading overlay ── */
    #loading {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 10; flex-direction: column; gap: 12px;
    }
    #loading p { font-size: 13px; color: var(--text-muted); }
    #loading.hidden { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 18px; height: 18px; border: 2px solid var(--border-2);
      border-top-color: var(--text-muted); border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    /* ── Header search ── */
    #header-search-wrap {
      position: relative;
    }
    #header-search {
      background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 4px; padding: 5px 10px 5px 28px;
      font: inherit; font-size: 12px; color: var(--text);
      outline: none; width: 200px; transition: border-color 0.15s, width 0.2s;
    }
    #header-search:focus { border-color: var(--border-2); width: 260px; }
    #header-search::placeholder { color: var(--text-muted); }
    .search-icon {
      position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 11px; pointer-events: none;
    }
    #search-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--surface); border: 1px solid var(--border-2);
      border-radius: 4px; overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      z-index: 100; display: none;
      max-height: 280px; overflow-y: auto;
    }
    #search-dropdown.open { display: block; }
    .search-result {
      padding: 8px 12px; cursor: pointer; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border); transition: background 0.1s;
    }
    .search-result:last-child { border-bottom: none; }
    .search-result:hover { background: var(--surface-2); }
    .search-result-name { font-size: 12.5px; font-weight: 500; flex: 1; }
    .search-result-meta { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
    .search-result-score {
      font-size: 11px; font-weight: 600; font-family: var(--font-mono);
      padding: 1px 5px; border-radius: 3px;
    }

    /* ── All accounts button ── */
    #btn-all-accounts {
      background: var(--surface-2); border: 1px solid var(--border-2);
      color: var(--text-muted); font: inherit; font-size: 11.5px; font-weight: 500;
      padding: 4px 10px; border-radius: 4px; cursor: pointer;
      white-space: nowrap; transition: background 0.15s, color 0.15s; flex-shrink: 0;
    }
    #btn-all-accounts:hover { background: var(--border-2); color: var(--text); }
    #btn-all-accounts.active { border-color: var(--blue); color: var(--blue); }

    /* ── All accounts panel ── */
    #accounts-panel {
      display: none;
      border-left: 1px solid var(--border);
      background: var(--surface);
      flex-direction: column;
      width: 380px;
      overflow: hidden;
    }
    #accounts-panel.open { display: flex; }

    /* When panel is open: hide sidebars, show panel */
    #app.panel-open #sidebar-left,
    #app.panel-open #sidebar-right { display: none; }
    #app.panel-open { grid-template-columns: 1fr 380px; }
    #app.panel-open #accounts-panel { grid-row: 2; grid-column: 2; }
    #app.panel-open #chat { grid-column: 1; }

    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-title {
      font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-muted);
    }
    .panel-close {
      background: none; border: none; color: var(--text-muted); cursor: pointer;
      font-size: 16px; line-height: 1; padding: 2px 4px;
      transition: color 0.1s;
    }
    .panel-close:hover { color: var(--text); }

    .panel-filter {
      padding: 10px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    #panel-search {
      width: 100%; background: var(--surface-2); border: 1px solid var(--border-2);
      border-radius: 3px; padding: 6px 10px; font: inherit; font-size: 12px;
      color: var(--text); outline: none;
    }
    #panel-search::placeholder { color: var(--text-muted); }

    #accounts-list-all {
      flex: 1; overflow-y: auto;
    }
    .all-account-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 16px; border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background 0.1s;
    }
    .all-account-row:hover { background: var(--surface-2); }
    .all-account-row:last-child { border-bottom: none; }
    .all-acc-trend { width: 12px; text-align: center; flex-shrink: 0; font-size: 11px; }
    .all-acc-name { flex: 1; font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .all-acc-stage { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); flex-shrink: 0; }
    .all-acc-score {
      font-size: 11px; font-weight: 600; font-family: var(--font-mono);
      padding: 1px 5px; border-radius: 3px; flex-shrink: 0;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p id="loading-text">Loading accounts and computing signals...</p>
    <p id="loading-sub" style="font-size:11px;color:#444;margin-top:4px;">This takes 1-2 minutes on first load</p>
  </div>

  <div id="app">
    <header>
      <div class="header-left">
        <h1>Sales Intelligence</h1>
        <span class="sep">·</span>
        <span class="stat"><strong id="stat-accounts">—</strong> accounts</span>
        <span class="sep">·</span>
        <span class="stat"><strong id="stat-flagged">—</strong> flagged</span>
      </div>
      <div class="header-center">
        <div id="header-search-wrap">
          <span class="search-icon">⌕</span>
          <input id="header-search" type="text" placeholder="Search accounts..." autocomplete="off" />
          <div id="search-dropdown"></div>
        </div>
        <button id="btn-all-accounts">All accounts</button>
      </div>
      <div class="header-right">
        <span class="stat"><strong id="stat-pipeline" style="color:var(--orange)">—</strong> at risk</span>
        <span class="sep" style="margin: 0 8px;">·</span>
        <span class="stat"><strong id="stat-expiring" style="color:var(--red)">—</strong> expiring &lt;14d</span>
        <span style="margin: 0 16px; color: var(--border);">|</span>
        <span class="stat">Ref: Mar 14, 2025</span>
        <div id="status-dot" style="margin-left: 12px;"></div>
      </div>
    </header>

    <aside id="sidebar-left">
      <div class="sidebar-label">At Risk</div>
      <div id="account-list"></div>
    </aside>

    <div id="chat">
      <div id="messages"></div>
      <div id="input-area">
        <form id="chat-form">
          <textarea
            id="input"
            placeholder="Ask about your accounts..."
            rows="1"
            autocomplete="off"
          ></textarea>
          <button type="submit" id="send-btn" disabled>Send</button>
        </form>
      </div>
    </div>

    <aside id="sidebar-right">
      <div class="sidebar-label">Growing</div>
      <div id="growing-list"></div>
    </aside>

    <div id="accounts-panel">
      <div class="panel-header">
        <span class="panel-title">All Accounts</span>
        <button class="panel-close" id="btn-close-panel">✕</button>
      </div>
      <div class="panel-filter">
        <input id="panel-search" type="text" placeholder="Filter accounts..." autocomplete="off" />
      </div>
      <div id="accounts-list-all"></div>
    </div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const messages = $('#messages');
    const input = $('#input');
    const sendBtn = $('#send-btn');
    const loadingEl = $('#loading');
    const loadingText = $('#loading-text');

    // ── Markdown ──────────────────────────────────────────────────────────
    marked.setOptions({ breaks: true });

    function cleanText(text) {
      return text.replaceAll('—', ' -').replaceAll('–', '-');
    }

    // ── Auto-resize textarea ──────────────────────────────────────────────
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    });

    // ── Append a message ─────────────────────────────────────────────────
    function appendMessage(role, text, actionResult, isBriefing = false) {
      const div = document.createElement('div');
      div.className = `message ${role}${isBriefing ? ' briefing' : ''}`;

      const label = document.createElement('div');
      label.className = 'message-label';
      label.textContent = isBriefing ? 'Morning Brief' : role === 'user' ? 'You' : 'Assistant';
      div.appendChild(label);

      const body = document.createElement('div');
      body.className = 'message-body';

      if (role === 'assistant') {
        body.innerHTML = marked.parse(cleanText(text));
      } else {
        body.textContent = text;
      }

      div.appendChild(body);

      if (actionResult) {
        const ar = document.createElement('div');
        ar.className = 'action-result';
        ar.textContent = '✓ ' + actionResult;
        div.appendChild(ar);
      }

      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    function appendThinking() {
      const div = document.createElement('div');
      div.className = 'message assistant thinking';
      const label = document.createElement('div');
      label.className = 'message-label';
      label.textContent = 'Assistant';
      const body = document.createElement('div');
      body.className = 'message-body';
      body.innerHTML = '<span></span><span></span><span></span>';
      div.appendChild(label);
      div.appendChild(body);
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    // ── Poll until ready ─────────────────────────────────────────────────
    const loadingSteps = [
      [0,   'Loading 200 accounts from CRM...'],
      [8000, 'Computing analytics signals...'],
      [20000,'Fetching activity sentiment for top accounts...'],
      [40000,'Generating morning briefing...'],
    ];
    loadingSteps.forEach(([delay, msg]) => {
      setTimeout(() => {
        if (!loadingEl.classList.contains('hidden')) loadingText.textContent = msg;
      }, delay);
    });

    async function waitForReady() {
      while (true) {
        try {
          const res = await fetch('/api/status');
          const data = await res.json();
          if (data.ready) return data;
          if (data.error) throw new Error(data.error);
        } catch (e) {
          loadingText.textContent = 'Error: ' + e.message;
          throw e;
        }
        await new Promise(r => setTimeout(r, 1000));
      }
    }

    // ── Account data store ───────────────────────────────────────────────
    let allAccounts = [];

    const trendIcon = (trend) => ({
      growing:  '<span style="color:var(--green)">↑</span>',
      declining:'<span style="color:var(--red)">↓</span>',
      stable:   '<span style="color:var(--text-muted)">→</span>',
      dark:     '<span style="color:var(--text-muted)">●</span>',
      new:      '<span style="color:var(--blue)">★</span>',
    })[trend] ?? '<span style="color:var(--border-2)">·</span>';

    const scoreClass = (s) => s >= 60 ? 'score-crit' : s >= 40 ? 'score-high' : 'score-med';

    // ── Header search ────────────────────────────────────────────────────
    const headerSearch = $('#header-search');
    const searchDropdown = $('#search-dropdown');

    headerSearch.addEventListener('input', () => {
      const q = headerSearch.value.trim().toLowerCase();
      if (!q || allAccounts.length === 0) { searchDropdown.classList.remove('open'); return; }
      const matches = allAccounts.filter(a => a.name.toLowerCase().includes(q)).slice(0, 8);
      if (!matches.length) { searchDropdown.classList.remove('open'); return; }
      searchDropdown.innerHTML = matches.map(a => `
        <div class="search-result" data-name="${a.name}">
          <span class="all-acc-trend">${trendIcon(a.trend)}</span>
          <span class="search-result-name">${a.name}</span>
          <span class="search-result-meta">${a.stage}</span>
          ${a.score > 0 ? `<span class="search-result-score ${scoreClass(a.score)}">${a.score}</span>` : ''}
        </div>`).join('');
      searchDropdown.classList.add('open');
      searchDropdown.querySelectorAll('.search-result').forEach(el => {
        el.addEventListener('click', () => {
          input.value = `Tell me about ${el.dataset.name}`;
          input.dispatchEvent(new Event('input'));
          headerSearch.value = '';
          searchDropdown.classList.remove('open');
          input.focus();
        });
      });
    });

    document.addEventListener('click', (e) => {
      if (!$('#header-search-wrap').contains(e.target)) searchDropdown.classList.remove('open');
    });

    headerSearch.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { headerSearch.value = ''; searchDropdown.classList.remove('open'); }
    });

    // ── All accounts panel ───────────────────────────────────────────────
    const app = $('#app');
    const accountsPanel = $('#accounts-panel');
    const btnAll = $('#btn-all-accounts');
    const btnClose = $('#btn-close-panel');
    const panelSearch = $('#panel-search');
    const accountsListAll = $('#accounts-list-all');

    function renderPanelList(accounts) {
      accountsListAll.innerHTML = accounts.map(a => `
        <div class="all-account-row" data-name="${a.name}">
          <span class="all-acc-trend">${trendIcon(a.trend)}</span>
          <span class="all-acc-name">${a.name}</span>
          <span class="all-acc-stage">${a.stage}</span>
          ${a.score > 0 ? `<span class="all-acc-score ${scoreClass(a.score)}">${a.score}</span>` : ''}
        </div>`).join('');
      accountsListAll.querySelectorAll('.all-account-row').forEach(el => {
        el.addEventListener('click', () => {
          input.value = `Tell me about ${el.dataset.name}`;
          input.dispatchEvent(new Event('input'));
          closePanel();
          input.focus();
        });
      });
    }

    function openPanel() {
      app.classList.add('panel-open');
      accountsPanel.classList.add('open');
      btnAll.classList.add('active');
      renderPanelList(allAccounts);
      panelSearch.focus();
    }

    function closePanel() {
      app.classList.remove('panel-open');
      accountsPanel.classList.remove('open');
      btnAll.classList.remove('active');
      panelSearch.value = '';
    }

    btnAll.addEventListener('click', () => {
      app.classList.contains('panel-open') ? closePanel() : openPanel();
    });
    btnClose.addEventListener('click', closePanel);

    panelSearch.addEventListener('input', () => {
      const q = panelSearch.value.trim().toLowerCase();
      renderPanelList(q ? allAccounts.filter(a => a.name.toLowerCase().includes(q)) : allAccounts);
    });

    // ── Load sidebar accounts ────────────────────────────────────────────
    function makeCard(acc, variant) {
      const card = document.createElement('div');
      card.className = 'account-card';
      card.title = `Click to ask about ${acc.name}`;

      if (variant === 'risk') {
        const icon = trendIcon(acc.trend);
        card.innerHTML = `
          <div class="account-row">
            <span class="account-name">${icon ? icon + ' ' : ''}${acc.name}</span>
            <span class="account-score ${scoreClass(acc.score)}">${acc.score}</span>
          </div>
          ${acc.topSignal ? `<div class="account-signal">${acc.topSignal}</div>` : ''}
          <div class="account-meta">${acc.stage}${acc.contractPct !== null ? ` · ${acc.contractPct}% balance` : ''}</div>
        `;
      } else {
        card.innerHTML = `
          <div class="account-row">
            <span class="account-name"><span style="color:var(--green)">↑</span> ${acc.name}</span>
          </div>
          ${acc.topSignal ? `<div class="account-signal" style="color:var(--green);opacity:0.7">${acc.topSignal}</div>` : ''}
          <div class="account-meta">${acc.stage}${acc.contractPct !== null ? ` · ${acc.contractPct}% balance` : ''}</div>
        `;
      }

      card.addEventListener('click', () => {
        input.value = `Tell me about ${acc.name}`;
        input.dispatchEvent(new Event('input'));
        input.focus();
      });
      return card;
    }

    async function loadAccounts() {
      const res = await fetch('/api/accounts');
      const { atRisk, growing, all } = await res.json();

      allAccounts = all ?? [];

      const list = $('#account-list');
      list.innerHTML = '';
      atRisk.forEach(acc => list.appendChild(makeCard(acc, 'risk')));

      const growingList = $('#growing-list');
      growingList.innerHTML = '';
      growing.forEach(acc => growingList.appendChild(makeCard(acc, 'growing')));
    }

    // ── Send message ─────────────────────────────────────────────────────
    async function sendMessage(text) {
      if (!text.trim()) return;
      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;

      appendMessage('user', text);

      // Create assistant message div immediately — tokens fill it in
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message assistant';
      const label = document.createElement('div');
      label.className = 'message-label';
      label.textContent = 'Assistant';
      const body = document.createElement('div');
      body.className = 'message-body';
      // Show dots until first token arrives
      body.innerHTML = '<span class="dot-pulse"><span></span><span></span><span></span></span>';
      msgDiv.appendChild(label);
      msgDiv.appendChild(body);
      messages.appendChild(msgDiv);
      messages.scrollTop = messages.scrollHeight;

      let fullText = '';
      let firstToken = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split('\n\n');
          buffer = parts.pop() ?? '';
          for (const part of parts) {
            if (!part.startsWith('data: ')) continue;
            let data;
            try { data = JSON.parse(part.slice(6)); } catch { continue; }

            if (data.token) {
              if (firstToken) { body.innerHTML = ''; firstToken = false; }
              fullText += data.token;
              body.innerHTML = marked.parse(cleanText(fullText));
              messages.scrollTop = messages.scrollHeight;
            } else if (data.done) {
              // Replace with clean reply (action block stripped)
              body.innerHTML = marked.parse(cleanText(data.cleanReply || fullText));
              if (data.actionResult) {
                const ar = document.createElement('div');
                ar.className = 'action-result';
                ar.textContent = '✓ ' + data.actionResult;
                msgDiv.appendChild(ar);
              }
            } else if (data.error) {
              body.textContent = 'Error: ' + data.error;
            }
          }
        }
      } catch (e) {
        body.textContent = 'Request failed: ' + e.message;
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    // ── Form submit ───────────────────────────────────────────────────────
    $('#chat-form').addEventListener('submit', (e) => {
      e.preventDefault();
      sendMessage(input.value);
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(input.value);
      }
    });

    // ── Boot ──────────────────────────────────────────────────────────────
    (async () => {
      const status = await waitForReady();

      $('#stat-accounts').textContent = status.accountCount;
      $('#stat-flagged').textContent = status.highPriorityCount;

      if (status.atRiskPipeline) {
        const v = status.atRiskPipeline;
        $('#stat-pipeline').textContent = v >= 1_000_000
          ? '$' + (v / 1_000_000).toFixed(1) + 'M'
          : '$' + Math.round(v / 1000) + 'K';
      }
      if (status.contractsExpiringSoon !== undefined) {
        $('#stat-expiring').textContent = status.contractsExpiringSoon;
      }

      $('#status-dot').classList.add('ready');

      await loadAccounts();

      // Load and display the briefing
      const briefRes = await fetch('/api/briefing');
      const { briefing } = await briefRes.json();
      if (briefing) {
        appendMessage('assistant', briefing, null, true);
      }

      loadingEl.classList.add('hidden');
      sendBtn.disabled = false;
      input.focus();
    })();
  </script>
</body>
</html>
