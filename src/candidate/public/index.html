<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sales Intelligence</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0a0a0a;
      --surface:     #111111;
      --surface-2:   #1a1a1a;
      --border:      #222222;
      --border-2:    #2d2d2d;
      --text:        #e0e0e0;
      --text-muted:  #666666;
      --text-dim:    #999999;
      --red:         #ef4444;
      --orange:      #f97316;
      --green:       #22c55e;
      --blue:        #60a5fa;
      --font-sans:   system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono:   ui-monospace, "SF Mono", Menlo, monospace;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; }

    /* ── Layout ── */
    #app { display: grid; grid-template-rows: 44px 1fr; grid-template-columns: 260px 1fr; height: 100vh; }

    /* ── Header ── */
    header {
      grid-column: 1 / -1;
      display: flex; align-items: center; gap: 24px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    header h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; color: var(--text); }
    header .sep { color: var(--border-2); }
    .stat { font-size: 12px; color: var(--text-muted); }
    .stat strong { color: var(--text-dim); font-weight: 500; }
    #status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--border-2); margin-left: auto; flex-shrink: 0;
      transition: background 0.3s;
    }
    #status-dot.ready { background: var(--green); }

    /* ── Sidebar ── */
    aside {
      border-right: 1px solid var(--border);
      background: var(--surface);
      overflow-y: auto;
      display: flex; flex-direction: column;
    }
    .sidebar-label {
      padding: 14px 16px 8px;
      font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-muted);
    }

    .account-card {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }
    .account-card:hover { background: var(--surface-2); }
    .account-card:first-of-type { border-top: none; }

    .account-row { display: flex; align-items: baseline; gap: 8px; justify-content: space-between; }
    .account-name { font-size: 12.5px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .account-score {
      font-size: 11px; font-weight: 600; font-family: var(--font-mono);
      flex-shrink: 0; padding: 1px 5px; border-radius: 3px;
    }
    .score-crit  { background: rgba(239,68,68,0.15);  color: var(--red); }
    .score-high  { background: rgba(249,115,22,0.15); color: var(--orange); }
    .score-med   { background: rgba(96,165,250,0.1);  color: var(--blue); }

    .account-signal {
      margin-top: 3px;
      font-size: 11px; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .account-meta {
      margin-top: 2px;
      font-size: 11px; color: var(--text-muted); font-family: var(--font-mono);
    }

    /* ── Chat ── */
    #chat { display: flex; flex-direction: column; min-height: 0; }

    #messages {
      flex: 1; overflow-y: auto; padding: 24px 32px;
      display: flex; flex-direction: column; gap: 24px;
      align-items: center;
    }

    .message { display: flex; flex-direction: column; gap: 8px; max-width: 700px; width: 100%; }

    .message-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .message.user   .message-label { color: var(--text-muted); }
    .message.assistant .message-label { color: var(--blue); }

    .message-body {
      font-size: 13.5px; line-height: 1.65; color: var(--text);
    }
    .message.user .message-body {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 14px;
      color: var(--text-dim);
    }

    /* markdown styling inside assistant messages */
    .message-body { font-size: 14px; line-height: 1.7; }
    .message-body p { margin-bottom: 0.75em; }
    .message-body p:last-child { margin-bottom: 0; }
    .message-body strong { color: var(--text); font-weight: 600; }
    .message-body ul { padding-left: 1.3em; margin-bottom: 0.75em; }
    .message-body ul li { margin-bottom: 0.45em; }
    .message-body ol { padding-left: 1.3em; margin-bottom: 0.75em; list-style: none; counter-reset: ol-counter; }
    .message-body ol li {
      counter-increment: ol-counter; position: relative; padding-left: 1.6em;
      margin-bottom: 1.4em; padding-bottom: 1.4em;
      border-bottom: 1px solid var(--border);
    }
    .message-body ol li::before {
      content: counter(ol-counter) ".";
      position: absolute; left: 0; color: var(--text-muted);
      font-weight: 600; font-size: 13px;
    }
    .message-body ol li:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .message-body code {
      font-family: var(--font-mono); font-size: 12px;
      background: var(--surface-2); padding: 1px 5px;
      border-radius: 3px; color: var(--text-dim);
    }
    .message-body h1 { font-size: 16px; font-weight: 700; color: var(--text); margin: 1.4em 0 0.6em; }
    .message-body h2 { font-size: 14px; font-weight: 700; color: var(--text); margin: 1.4em 0 0.5em; letter-spacing: 0.01em; }
    .message-body h3 { font-size: 13px; font-weight: 600; color: var(--text-dim); margin: 1em 0 0.4em; text-transform: uppercase; letter-spacing: 0.06em; }
    .message-body h1:first-child, .message-body h2:first-child, .message-body h3:first-child { margin-top: 0; }

    .action-result {
      font-size: 12px; color: var(--green); margin-top: 6px;
      font-family: var(--font-mono);
    }

    /* ── Briefing card ── */
    .message.briefing .message-label {
      color: var(--text-muted);
      display: flex; align-items: center; gap: 8px;
    }
    .message.briefing .message-label::before {
      content: '';
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: var(--green); flex-shrink: 0;
    }
    .message.briefing .message-body {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 2px solid var(--border-2);
      border-radius: 4px;
      padding: 20px 24px;
    }

    /* ── Thinking indicator ── */
    .thinking .message-body { display: flex; align-items: center; gap: 4px; padding: 4px 0; }
    .thinking .message-body span {
      display: inline-block; width: 5px; height: 5px;
      border-radius: 50%; background: var(--text-muted);
      animation: dot-fade 1.2s ease-in-out infinite;
    }
    .thinking .message-body span:nth-child(2) { animation-delay: 0.2s; }
    .thinking .message-body span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-fade { 0%,80%,100%{opacity:0.15} 40%{opacity:1} }

    /* ── Input ── */
    #input-area {
      padding: 16px 32px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      display: flex; justify-content: center;
    }
    #input-area form { display: flex; gap: 10px; width: 100%; max-width: 760px; }

    textarea {
      flex: 1; resize: none; overflow: hidden;
      background: var(--surface); border: 1px solid var(--border-2);
      border-radius: 4px; padding: 9px 12px;
      font: inherit; font-size: 13.5px; color: var(--text);
      outline: none; line-height: 1.5; min-height: 40px; max-height: 140px;
      transition: border-color 0.15s;
    }
    textarea:focus { border-color: var(--border-2); }
    textarea::placeholder { color: var(--text-muted); }

    button[type=submit] {
      background: var(--surface-2); border: 1px solid var(--border-2);
      color: var(--text-dim); font: inherit; font-size: 12px; font-weight: 500;
      padding: 0 16px; height: 40px; border-radius: 4px; cursor: pointer;
      white-space: nowrap; transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    button[type=submit]:hover:not(:disabled) { background: var(--border-2); color: var(--text); }
    button[type=submit]:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Loading overlay ── */
    #loading {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 10; flex-direction: column; gap: 12px;
    }
    #loading p { font-size: 13px; color: var(--text-muted); }
    #loading.hidden { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 18px; height: 18px; border: 2px solid var(--border-2);
      border-top-color: var(--text-muted); border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p id="loading-text">Loading accounts and computing signals...</p>
  </div>

  <div id="app">
    <header>
      <h1>Sales Intelligence</h1>
      <span class="sep">·</span>
      <span class="stat"><strong id="stat-accounts">—</strong> accounts</span>
      <span class="sep">·</span>
      <span class="stat"><strong id="stat-flagged">—</strong> flagged</span>
      <span class="sep">·</span>
      <span class="stat">Ref: Mar 14, 2025</span>
      <div id="status-dot"></div>
    </header>

    <aside>
      <div class="sidebar-label">At Risk</div>
      <div id="account-list"></div>
    </aside>

    <div id="chat">
      <div id="messages"></div>
      <div id="input-area">
        <form id="chat-form">
          <textarea
            id="input"
            placeholder="Ask about your accounts..."
            rows="1"
            autocomplete="off"
          ></textarea>
          <button type="submit" id="send-btn" disabled>Send</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const messages = $('#messages');
    const input = $('#input');
    const sendBtn = $('#send-btn');
    const loadingEl = $('#loading');
    const loadingText = $('#loading-text');

    // ── Markdown ──────────────────────────────────────────────────────────
    marked.setOptions({ breaks: true });

    function cleanText(text) {
      return text.replaceAll('—', ' -').replaceAll('–', '-');
    }

    // ── Auto-resize textarea ──────────────────────────────────────────────
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    });

    // ── Append a message ─────────────────────────────────────────────────
    function appendMessage(role, text, actionResult, isBriefing = false) {
      const div = document.createElement('div');
      div.className = `message ${role}${isBriefing ? ' briefing' : ''}`;

      const label = document.createElement('div');
      label.className = 'message-label';
      label.textContent = isBriefing ? 'Daily Brief' : role === 'user' ? 'You' : 'Assistant';

      const body = document.createElement('div');
      body.className = 'message-body';

      if (role === 'assistant') {
        body.innerHTML = marked.parse(cleanText(text));
      } else {
        body.textContent = text;
      }

      div.appendChild(label);
      div.appendChild(body);

      if (actionResult) {
        const ar = document.createElement('div');
        ar.className = 'action-result';
        ar.textContent = '✓ ' + actionResult;
        div.appendChild(ar);
      }

      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    function appendThinking() {
      const div = document.createElement('div');
      div.className = 'message assistant thinking';
      const label = document.createElement('div');
      label.className = 'message-label';
      label.textContent = 'Assistant';
      const body = document.createElement('div');
      body.className = 'message-body';
      body.innerHTML = '<span></span><span></span><span></span>';
      div.appendChild(label);
      div.appendChild(body);
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    // ── Poll until ready ─────────────────────────────────────────────────
    async function waitForReady() {
      while (true) {
        try {
          const res = await fetch('/api/status');
          const data = await res.json();
          if (data.ready) return data;
          if (data.error) throw new Error(data.error);
        } catch (e) {
          loadingText.textContent = 'Error: ' + e.message;
          throw e;
        }
        await new Promise(r => setTimeout(r, 1000));
      }
    }

    // ── Load sidebar accounts ────────────────────────────────────────────
    async function loadAccounts() {
      const res = await fetch('/api/accounts');
      const { accounts } = await res.json();
      const list = $('#account-list');
      list.innerHTML = '';
      accounts.forEach(acc => {
        const card = document.createElement('div');
        card.className = 'account-card';
        card.title = `Click to ask about ${acc.name}`;

        const scoreClass = acc.score >= 60 ? 'score-crit' : acc.score >= 40 ? 'score-high' : 'score-med';
        const trendIcon = { growing: '<span style="color:var(--green)">↑</span>', declining: '<span style="color:var(--red)">↓</span>', dark: '<span style="color:var(--text-muted)">●</span>', new: '<span style="color:var(--blue)">★</span>' }[acc.trend] ?? '';

        card.innerHTML = `
          <div class="account-row">
            <span class="account-name">${trendIcon ? trendIcon + ' ' : ''}${acc.name}</span>
            <span class="account-score ${scoreClass}">${acc.score}</span>
          </div>
          ${acc.topSignal ? `<div class="account-signal">${acc.topSignal}</div>` : ''}
          <div class="account-meta">${acc.stage}${acc.contractPct !== null ? ` · ${acc.contractPct}% balance` : ''}</div>
        `;

        card.addEventListener('click', () => {
          input.value = `Tell me about ${acc.name}`;
          input.dispatchEvent(new Event('input'));
          input.focus();
        });

        list.appendChild(card);
      });
    }

    // ── Send message ─────────────────────────────────────────────────────
    async function sendMessage(text) {
      if (!text.trim()) return;
      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;

      appendMessage('user', text);
      const thinking = appendThinking();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        thinking.remove();
        if (data.error) {
          appendMessage('assistant', 'Error: ' + data.error);
        } else {
          appendMessage('assistant', data.reply, data.actionResult);
        }
      } catch (e) {
        thinking.remove();
        appendMessage('assistant', 'Request failed: ' + e.message);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    // ── Form submit ───────────────────────────────────────────────────────
    $('#chat-form').addEventListener('submit', (e) => {
      e.preventDefault();
      sendMessage(input.value);
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(input.value);
      }
    });

    // ── Boot ──────────────────────────────────────────────────────────────
    (async () => {
      const status = await waitForReady();

      $('#stat-accounts').textContent = status.accountCount;
      $('#stat-flagged').textContent = status.highPriorityCount;
      $('#status-dot').classList.add('ready');

      await loadAccounts();

      // Load and display the briefing
      const briefRes = await fetch('/api/briefing');
      const { briefing } = await briefRes.json();
      if (briefing) {
        appendMessage('assistant', briefing, null, true);
      }

      loadingEl.classList.add('hidden');
      sendBtn.disabled = false;
      input.focus();
    })();
  </script>
</body>
</html>
